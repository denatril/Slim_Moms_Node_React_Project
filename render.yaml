services:
  - type: web
    name: slim-moms-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run seed && npm start
    healthCheckPath: /api-docs/
    envVars:
      - key: NODE_VERSION
        value: "25"
      - key: DB_HOST
        sync: false
      - key: JWT_SECRET
        generateValue: true
